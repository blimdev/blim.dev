<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More Apps by blim.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f0de;
      --card: #fbf8f1;
      --ink: #252525;
      --line: #232323;
      --yellow: #f6cf5b;
      --teal: #67bdd0;
      --purple: #b587d9;
      --red: #fb7d86;
      --blue: #8f9ae4;
      --green: #67c8b2;
      --pill: #fffdf8;
      --active: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Nunito", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      width: 62px;
      height: 62px;
      border: 3px solid var(--line);
      border-radius: 18px;
      background: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      box-shadow: 0 3px 0 var(--line);
      transform: rotate(-4deg);
      flex: 0 0 auto;
    }

    .eyebrow {
      margin: 0 0 2px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: #67625b;
    }

    h1 {
      margin: 0;
      font-family: "Baloo 2", cursive;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 1rem;
      color: #4d4a45;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 108px;
      padding: 10px 14px 8px;
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 3px 0 var(--line);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-family: "Baloo 2", cursive;
      font-size: 2rem;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: -2px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5c574f;
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .filter {
      border: 2.5px solid var(--line);
      border-radius: 999px;
      background: var(--pill);
      padding: 9px 16px 8px;
      font-weight: 700;
      font-size: 0.94rem;
      line-height: 1;
      cursor: pointer;
    }

    .filter.active {
      background: var(--active);
      color: #f6d766;
    }

    .app-sections {
      display: grid;
      gap: 24px;
    }

    .app-section {
      min-width: 0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 14px;
      margin: 0 0 10px;
    }

    .section-title {
      margin: 0;
      font-family: "Baloo 2", cursive;
      font-size: 2rem;
      line-height: 0.95;
    }

    .section-count {
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--pill);
      padding: 4px 10px 3px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    .phone-rail {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      padding: 0 2px 10px;
      scrollbar-width: thin;
    }

    .phone-slider {
      display: grid;
      gap: 8px;
    }

    .slider-dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      min-height: 24px;
    }

    .slider-dot {
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .slider-dot::after {
      content: "";
      width: 10px;
      height: 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--pill);
      box-shadow: 0 1.5px 0 var(--line);
      transition: width 160ms ease, background 160ms ease;
    }

    .slider-dot.active {
      width: 34px;
      background: transparent;
    }

    .slider-dot.active::after {
      width: 24px;
      background: #2c2c2c;
    }

    .phone-card {
      width: min(76vw, 260px);
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .phone-thumb {
      position: relative;
      height: 360px;
      border: 3px solid var(--line);
      border-radius: 34px;
      background: #202020;
      padding: 16px 10px 18px;
      box-shadow: inset 0 0 0 2px #050505;
      overflow: hidden;
    }

    .phone-thumb::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      z-index: 2;
      width: 64px;
      height: 8px;
      border-radius: 999px;
      background: #050505;
      transform: translateX(-50%);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border: 2px solid #050505;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
    }

    .phone-screen.has-image {
      background: #fffdf8;
      align-items: stretch;
      justify-content: stretch;
    }

    .phone-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      display: block;
    }

    .phone-screen.teal { background: var(--teal); }
    .phone-screen.yellow { background: var(--yellow); }
    .phone-screen.purple { background: var(--purple); }
    .phone-screen.red { background: var(--red); }
    .phone-screen.blue { background: var(--blue); }
    .phone-screen.green { background: var(--green); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-status {
      grid-column: 1 / -1;
      padding: 18px;
      border: 3px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 4px 0 var(--line);
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--line);
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .card.is-link {
      cursor: pointer;
    }

    .thumb {
      position: relative;
      height: 180px;
      border: 2.5px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
    }

    .thumb.has-image {
      align-items: stretch;
      justify-content: stretch;
      background: #fffdf8;
    }

    .thumb-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: none;
      image-rendering: auto;
    }

    .thumb.teal { background: var(--teal); }
    .thumb.yellow { background: var(--yellow); }
    .thumb.purple { background: var(--purple); }
    .thumb.red { background: var(--red); }
    .thumb.blue { background: var(--blue); }
    .thumb.green { background: var(--green); }

    .year {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1;
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 3px 8px 2px;
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1;
    }

    .content {
      padding: 10px 2px 4px;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .title {
      margin: 0;
      font-family: "Baloo 2", cursive;
      font-size: 1.9rem;
      line-height: 0.95;
    }

    .desc {
      margin: 4px 0 10px;
      color: #4d4943;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-top: auto;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag,
    .badge {
      display: inline-flex;
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px 2px;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1;
    }

    .tag {
      background: #f3e9b7;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      margin-left: auto;
    }

    .badge {
      background: #2c2c2c;
      color: #f6d766;
      text-transform: lowercase;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 2px dashed #d8cfbc;
      color: #5f5a52;
      font-size: 0.88rem;
    }

    .footer-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .footer a {
      color: inherit;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="brand">
        <div class="logo" id="site-logo"></div>
        <div>
          <p class="eyebrow" id="site-eyebrow"></p>
          <h1 id="site-name"></h1>
          <p class="subtitle" id="site-tagline"></p>
        </div>
      </div>

      <div class="stats" id="site-stats"></div>
    </section>

    <nav class="filters" id="site-filters" aria-label="Categories"></nav>

    <section class="app-sections" id="apps-sections">
      <div class="grid-status">Loading apps...</div>
    </section>

    <footer class="footer">
      <div id="footer-copy"></div>
      <div class="footer-links" id="footer-links"></div>
    </footer>
  </main>

  <script>
    const siteLogo = document.getElementById("site-logo");
    const siteEyebrow = document.getElementById("site-eyebrow");
    const siteName = document.getElementById("site-name");
    const siteTagline = document.getElementById("site-tagline");
    const siteStats = document.getElementById("site-stats");
    const siteFilters = document.getElementById("site-filters");
    const appsSections = document.getElementById("apps-sections");
    const footerCopy = document.getElementById("footer-copy");
    const footerLinks = document.getElementById("footer-links");
    let allApps = [];
    let activeFilter = "All";

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderStatus(message) {
      appsSections.innerHTML = `<div class="grid-status">${escapeHtml(message)}</div>`;
    }

    function getFilterLabelsFromApps(apps) {
      const uniqueTags = new Set();

      apps.forEach((app) => {
        (app.tags || []).forEach((tag) => uniqueTags.add(tag));
      });

      return ["All", ...Array.from(uniqueTags).sort((a, b) => a.localeCompare(b))];
    }

    function getFilteredApps() {
      if (activeFilter === "All") {
        return allApps;
      }

      return allApps.filter((app) => (app.tags || []).includes(activeFilter));
    }

    function setActiveFilter(nextFilter) {
      activeFilter = nextFilter;

      siteFilters.querySelectorAll(".filter").forEach((filterEl) => {
        filterEl.classList.toggle(
          "active",
          filterEl.dataset.filter === activeFilter
        );
      });

      renderApps(getFilteredApps());
    }

    function renderSite(site, apps) {
      document.title = `More Apps by ${site.name}`;
      siteLogo.innerHTML = site.logo;
      siteEyebrow.textContent = site.eyebrow;
      siteName.textContent = site.name;
      siteTagline.textContent = site.tagline;
      footerCopy.innerHTML = site.footerCopy;

      siteStats.innerHTML = "";
      const derivedStats = [
        { value: String(apps.length), label: "apps" },
        ...(site.stats || []).filter((stat) => {
          return stat.label.toLowerCase() !== "apps" && stat.label.toLowerCase() !== "years";
        })
      ];

      derivedStats.forEach((stat) => {
        const statEl = document.createElement("div");
        statEl.className = "stat";
        statEl.innerHTML = `
          <strong>${stat.value}</strong>
          <span>${escapeHtml(stat.label)}</span>
        `;
        siteStats.appendChild(statEl);
      });

      siteFilters.innerHTML = "";
      const filters = getFilterLabelsFromApps(apps);
      activeFilter = "All";

      filters.forEach((filter) => {
        const filterEl = document.createElement("span");
        filterEl.className = `filter${filter === activeFilter ? " active" : ""}`;
        filterEl.textContent = filter;
        filterEl.dataset.filter = filter;
        filterEl.setAttribute("role", "button");
        filterEl.setAttribute("tabindex", "0");
        filterEl.addEventListener("click", () => {
          setActiveFilter(filter);
        });
        filterEl.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            setActiveFilter(filter);
          }
        });
        siteFilters.appendChild(filterEl);
      });

      footerLinks.innerHTML = "";
      (site.footerLinks || []).forEach((link) => {
        const linkEl = document.createElement("a");
        linkEl.href = link.href;
        linkEl.textContent = link.label;
        if (link.href.startsWith("http")) {
          linkEl.target = "_blank";
          linkEl.rel = "noreferrer";
        }
        footerLinks.appendChild(linkEl);
      });
    }

    function getDisplay(app) {
      return String(app.display || app.type || "desktop").toLowerCase() === "phone"
        ? "phone"
        : "desktop";
    }

    function getBadges(app) {
      const badges = Array.isArray(app.badge) ? app.badge : String(app.badge || "").split(",");
      return badges.map((badge) => badge.trim()).filter(Boolean);
    }

    function renderBadgePills(app) {
      return getBadges(app)
        .map((badge) => `<span class="badge">${escapeHtml(badge)}</span>`)
        .join("");
    }

    function makeCardClickable(article, app) {
      if (!app.url) {
        return;
      }

      article.classList.add("is-link");
      article.addEventListener("click", () => {
        window.location.href = app.url;
      });
    }

    function renderPhoneCard(app) {
      const article = document.createElement("article");
      article.className = "card phone-card";
      makeCardClickable(article, app);

      const tags = (app.tags || [])
        .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
        .join("");
      const screenContent = app.image
        ? `<img class="phone-image" src="${escapeHtml(app.image)}" alt="${escapeHtml(app.title)} screenshot">`
        : app.icon;

      article.innerHTML = `
        <div class="phone-thumb">
          <span class="year">${escapeHtml(app.year)}</span>
          <div class="phone-screen ${escapeHtml(app.theme)}${app.image ? " has-image" : ""}">
            ${screenContent}
          </div>
        </div>
        <div class="content">
          <h2 class="title">${escapeHtml(app.title)}</h2>
          <p class="desc">${escapeHtml(app.description)}</p>
          <div class="meta">
            <div class="tags">${tags}</div>
            <div class="badges">${renderBadgePills(app)}</div>
          </div>
        </div>
      `;

      return article;
    }

    function renderDesktopCard(app) {
      const article = document.createElement("article");
      article.className = "card";
      makeCardClickable(article, app);

      const tags = (app.tags || [])
        .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
        .join("");
      const thumbContent = app.image
        ? `<img class="thumb-image" src="${escapeHtml(app.image)}" alt="${escapeHtml(app.title)} screenshot">`
        : app.icon;

      article.innerHTML = `
        <div class="thumb ${escapeHtml(app.theme)}${app.image ? " has-image" : ""}">
          <span class="year">${escapeHtml(app.year)}</span>
          ${thumbContent}
        </div>
        <div class="content">
          <h2 class="title">${escapeHtml(app.title)}</h2>
          <p class="desc">${escapeHtml(app.description)}</p>
          <div class="meta">
            <div class="tags">${tags}</div>
            <div class="badges">${renderBadgePills(app)}</div>
          </div>
        </div>
      `;

      return article;
    }

    function renderSection(title, apps, layout) {
      const section = document.createElement("section");
      section.className = "app-section";
      section.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">${escapeHtml(title)}</h2>
          <span class="section-count">${apps.length} ${apps.length === 1 ? "item" : "items"}</span>
        </div>
      `;

      const list = document.createElement("div");
      list.className = layout === "phone" ? "phone-rail" : "grid";
      apps.forEach((app) => {
        list.appendChild(layout === "phone" ? renderPhoneCard(app) : renderDesktopCard(app));
      });

      if (layout === "phone") {
        const slider = document.createElement("div");
        slider.className = "phone-slider";

        const dots = document.createElement("div");
        dots.className = "slider-dots";
        dots.setAttribute("aria-label", `${title} slides`);

        const dotButtons = apps.map((app, index) => {
          const dot = document.createElement("button");
          dot.className = `slider-dot${index === 0 ? " active" : ""}`;
          dot.type = "button";
          dot.setAttribute("aria-current", index === 0 ? "true" : "false");
          dot.setAttribute("aria-label", `Show ${app.title}`);
          dot.addEventListener("click", (event) => {
            event.stopPropagation();
            list.scrollTo({
              left: list.children[index].offsetLeft - list.offsetLeft,
              behavior: "smooth",
            });
          });
          dots.appendChild(dot);
          return dot;
        });

        const updateDots = () => {
          let closestIndex = 0;
          let closestDistance = Infinity;

          Array.from(list.children).forEach((card, index) => {
            const distance = Math.abs(card.offsetLeft - list.offsetLeft - list.scrollLeft);
            if (distance < closestDistance) {
              closestDistance = distance;
              closestIndex = index;
            }
          });

          dotButtons.forEach((dot, index) => {
            dot.classList.toggle("active", index === closestIndex);
            dot.setAttribute("aria-current", index === closestIndex ? "true" : "false");
          });
        };

        list.addEventListener("scroll", () => {
          window.requestAnimationFrame(updateDots);
        });
        window.addEventListener("resize", updateDots);

        slider.appendChild(list);
        slider.appendChild(dots);
        section.appendChild(slider);
      } else {
        section.appendChild(list);
      }

      return section;
    }

    function renderApps(apps) {
      appsSections.innerHTML = "";

      if (!apps.length) {
        renderStatus(`No apps found for ${activeFilter}.`);
        return;
      }

      const phoneApps = apps.filter((app) => getDisplay(app) === "phone");
      const desktopApps = apps.filter((app) => getDisplay(app) === "desktop");

      if (phoneApps.length) {
        appsSections.appendChild(renderSection("Mobile Friendly", phoneApps, "phone"));
      }

      if (desktopApps.length) {
        appsSections.appendChild(renderSection("Desktop Sites", desktopApps, "desktop"));
      }
    }

    async function loadData() {
      try {
        const [siteResponse, appsResponse] = await Promise.all([
          fetch("./site.json"),
          fetch("./apps.json")
        ]);

        if (!siteResponse.ok) {
          throw new Error(`site.json HTTP ${siteResponse.status}`);
        }

        if (!appsResponse.ok) {
          throw new Error(`apps.json HTTP ${appsResponse.status}`);
        }

        const [site, apps] = await Promise.all([
          siteResponse.json(),
          appsResponse.json()
        ]);

        allApps = apps;
        renderSite(site, apps);
        renderApps(getFilteredApps());
      } catch (error) {
        renderStatus(
          "Could not load site.json or apps.json. If this page is opened directly from file://, use a small local web server so the JSON files can be loaded."
        );
      }
    }

    loadData();
  </script>
</body>
</html>
