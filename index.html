<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More Apps by BenLim.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f0de;
      --card: #fbf8f1;
      --ink: #252525;
      --line: #232323;
      --yellow: #f6cf5b;
      --teal: #67bdd0;
      --purple: #b587d9;
      --red: #fb7d86;
      --blue: #8f9ae4;
      --green: #67c8b2;
      --pill: #fffdf8;
      --active: #2b2b2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Nunito", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 22px 18px 36px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      min-width: 0;
    }

    .logo {
      width: 62px;
      height: 62px;
      border: 3px solid var(--line);
      border-radius: 18px;
      background: var(--yellow);
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      box-shadow: 0 3px 0 var(--line);
      transform: rotate(-4deg);
      flex: 0 0 auto;
    }

    .eyebrow {
      margin: 0 0 2px;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 700;
      color: #67625b;
    }

    h1 {
      margin: 0;
      font-family: "Baloo 2", cursive;
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 1rem;
      color: #4d4a45;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 108px;
      padding: 10px 14px 8px;
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 3px 0 var(--line);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-family: "Baloo 2", cursive;
      font-size: 2rem;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: -2px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5c574f;
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .filter {
      border: 2.5px solid var(--line);
      border-radius: 999px;
      background: var(--pill);
      padding: 9px 16px 8px;
      font-weight: 700;
      font-size: 0.94rem;
      line-height: 1;
    }

    .filter.active {
      background: var(--active);
      color: #f6d766;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-status {
      grid-column: 1 / -1;
      padding: 18px;
      border: 3px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 4px 0 var(--line);
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 3px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--line);
      padding: 10px;
    }

    .card.is-link {
      cursor: pointer;
    }

    .thumb {
      position: relative;
      height: 180px;
      border: 2.5px solid var(--line);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
    }

    .thumb.teal { background: var(--teal); }
    .thumb.yellow { background: var(--yellow); }
    .thumb.purple { background: var(--purple); }
    .thumb.red { background: var(--red); }
    .thumb.blue { background: var(--blue); }
    .thumb.green { background: var(--green); }

    .year {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 2px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 3px 8px 2px;
      font-size: 0.68rem;
      font-weight: 800;
      line-height: 1;
    }

    .content {
      padding: 10px 2px 4px;
    }

    .title {
      margin: 0;
      font-family: "Baloo 2", cursive;
      font-size: 1.9rem;
      line-height: 0.95;
    }

    .desc {
      margin: 4px 0 10px;
      color: #4d4943;
      font-size: 0.95rem;
      line-height: 1.25;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag,
    .badge {
      display: inline-flex;
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px 2px;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1;
    }

    .tag {
      background: #f3e9b7;
    }

    .badge {
      background: #2c2c2c;
      color: #f6d766;
      text-transform: lowercase;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 2px dashed #d8cfbc;
      color: #5f5a52;
      font-size: 0.88rem;
    }

    .footer a {
      color: inherit;
      margin-left: 12px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
      }

      .stats {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="brand">
        <div class="logo">&#129412;</div>
        <div>
          <p class="eyebrow">More apps by</p>
          <h1>BenLim.dev</h1>
          <p class="subtitle">Tiny apps for big imaginations. Made with juice.</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <strong>10</strong>
          <span>apps</span>
        </div>
        <div class="stat">
          <strong>4</strong>
          <span>years</span>
        </div>
        <div class="stat">
          <strong>&infin;</strong>
          <span>ideas</span>
        </div>
      </div>
    </section>

    <nav class="filters" aria-label="Categories">
      <span class="filter">All</span>
      <span class="filter">Games</span>
      <span class="filter">Learning</span>
      <span class="filter active">Family</span>
      <span class="filter">Creative</span>
      <span class="filter">Tools</span>
      <span class="filter">Home</span>
      <span class="filter">Pets</span>
    </nav>

    <section class="grid" id="apps-grid">
      <div class="grid-status">Loading apps...</div>
    </section>

    <footer class="footer">
      <div>&copy; BenLim.dev &middot; made with crayons &amp; code</div>
      <div>
        <a href="#">twitter</a>
        <a href="#">github</a>
        <a href="#">email</a>
      </div>
    </footer>
  </main>

  <script>
    const appsGrid = document.getElementById("apps-grid");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderStatus(message) {
      appsGrid.innerHTML = `<div class="grid-status">${escapeHtml(message)}</div>`;
    }

    function renderApps(apps) {
      appsGrid.innerHTML = "";

      apps.forEach((app) => {
        const article = document.createElement("article");
        article.className = "card" + (app.url ? " is-link" : "");

        const tags = (app.tags || [])
          .map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`)
          .join("");

        article.innerHTML = `
          <div class="thumb ${escapeHtml(app.theme)}">
            <span class="year">${escapeHtml(app.year)}</span>
            ${app.icon}
          </div>
          <div class="content">
            <h2 class="title">${escapeHtml(app.title)}</h2>
            <p class="desc">${escapeHtml(app.description)}</p>
            <div class="meta">
              <div class="tags">${tags}</div>
              <span class="badge">${escapeHtml(app.badge)}</span>
            </div>
          </div>
        `;

        if (app.url) {
          article.addEventListener("click", () => {
            window.location.href = app.url;
          });
        }

        appsGrid.appendChild(article);
      });
    }

    async function loadApps() {
      try {
        const response = await fetch("./apps.json");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const apps = await response.json();
        renderApps(apps);
      } catch (error) {
        renderStatus(
          "Could not load apps.json. If this page is opened directly from file://, use a small local web server so the JSON file can be loaded."
        );
      }
    }

    loadApps();
  </script>
</body>
</html>
